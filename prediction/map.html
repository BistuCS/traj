<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>轨迹预测 & 关联 - 地图可视化</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#1e1e2e;color:#fff;height:100vh;display:flex;flex-direction:column}
    .top{padding:12px 16px;background:#2d2d44;display:flex;gap:12px;align-items:center}
    #map{flex:1;z-index:1}
    .btn{background:#4c6ef5;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
    .btn:disabled{background:#666}
    .log{font-size:12px;color:#ccc}
</style>

<body>
<div class="top">
    <input type="file" id="file" accept=".csv" style="color:#fff">
    <button class="btn" id="run">上传并运行</button>
    <button class="btn" id="play" disabled>播放</button>
    <button class="btn" id="pause" disabled>暂停</button>
    <span class="log" id="info"></span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([39.9, 116.4], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap contributors'
}).addTo(map);

let history = {};
let predicts = [];
let assocs = [];
let playing = false;

const $ = s => document.querySelector(s);

$("#run").onclick = async () => {
    const f = $("#file").files[0];
    if (!f) return alert("请选择CSV文件");
    const fd = new FormData();
    fd.append("file", f);
    $("#run").disabled = true;
    $("#info").textContent = "处理中...";

    const r = await fetch("/upload", { method: "POST", body: fd });
    const j = await r.json();

    if (!j.ok) {
        alert("错误：" + j.err);
        $("#run").disabled = false;
        return;
    }

    history = j.history;
    predicts = j.predict;

    $("#info").textContent = `目标数：${Object.keys(history).length} 预测点：${predicts.length}`;
    $("#play").disabled = false;
    $("#run").disabled = false;
    drawAll();
};

function drawAll(){
    // ==================== 历史轨迹：线 + 点 + 悬浮提示 ====================
    Object.keys(history).forEach(id => {
        const pts = history[id];
        const latlngs = pts.map(p => [p.lat, p.lng]);

        // 画线
        L.polyline(latlngs, { color: '#6699ff', weight: 2, opacity: 0.6 }).addTo(map);

        // 画点 + 鼠标悬浮显示 id x y z
        pts.forEach(p => {
            L.circleMarker([p.lat, p.lng], {
                radius: 4,
                color: '#0066ff',
                fillColor: '#0066ff',
                fillOpacity: 1
            }).addTo(map)
              .bindTooltip(`ID: ${id}<br/>X: ${p.lng.toFixed(6)}<br/>Y: ${p.lat.toFixed(6)}<br/>Z: ${p.z.toFixed(3)}`);
        });
    });

    // ==================== 预测点 ====================
    predicts.forEach(p => {
        L.circleMarker([p.lat, p.lng], {
            radius: 5,
            color: '#ff3333',
            fillColor: '#ff3333',
            fillOpacity: 1
        }).addTo(map)
          .bindTooltip(`【预测】ID: ${p.id}<br/>X: ${p.lng.toFixed(6)}<br/>Y: ${p.lat.toFixed(6)}<br/>Z: ${p.z.toFixed(3)}`);
    });
}

$("#play").onclick = () => { playing = true; };
$("#pause").onclick = () => { playing = false; };
</script>
</body>
</html>
