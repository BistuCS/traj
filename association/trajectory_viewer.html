<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关联融合轨迹实时展示</title>
  <style>
    :root {
      --bg: #f4f1eb;
      --panel: #ffffff;
      --ink: #17201b;
      --muted: #6b756f;
      --line: #d9d3c7;
      --accent: #0e7c68;
      --danger: #c2472f;
      --map-bg: #dfe7df;
      --shadow: 0 18px 42px rgba(23, 32, 27, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(120deg, rgba(14, 124, 104, 0.08), transparent 34%),
        linear-gradient(280deg, rgba(194, 71, 47, 0.08), transparent 42%),
        var(--bg);
    }

    .app { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100vh; }
    aside { padding: 24px; border-right: 1px solid var(--line); background: rgba(255, 255, 255, 0.84); backdrop-filter: blur(12px); }
    main { padding: 24px; min-width: 0; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
    .subtitle { margin: 0 0 20px; color: var(--muted); line-height: 1.5; font-size: 13px; }
    .toolbar, .playback { display: grid; gap: 10px; margin-bottom: 16px; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button, .file-label {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }

    button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    .file-label { display: grid; place-items: center; }
    input[type="file"] { display: none; }
    .control { display: grid; gap: 6px; }
    .control label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
    .stat { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .stat strong { display: block; font-size: 22px; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: 12px; }

    .time-card { padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 14px; color: var(--muted); font-size: 12px; line-height: 1.5; word-break: break-word; }
    .time-card strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
    .legend { display: flex; gap: 14px; align-items: center; margin: 10px 0 16px; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; gap: 6px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .dot.predicted { background: transparent; border: 2px solid var(--accent); }

    .track-list { display: grid; gap: 8px; max-height: calc(100vh - 460px); overflow: auto; padding-right: 4px; }
    .track-item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
    .track-item.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .swatch { width: 12px; height: 12px; border-radius: 50%; }
    .track-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
    .track-count { color: var(--muted); font-size: 12px; }

    .map-shell {
      position: relative;
      height: calc(100vh - 48px);
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--map-bg);
      box-shadow: var(--shadow);
    }

    .tile-map { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: var(--map-bg); cursor: grab; }
    .tile-map.dragging { cursor: grabbing; }
    .tile-map img { position: absolute; width: 256px; height: 256px; user-select: none; -webkit-user-drag: none; }
    canvas { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; pointer-events: none; }
    .map-info { position: absolute; z-index: 2; left: 16px; bottom: 16px; max-width: min(600px, calc(100% - 32px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, 0.9); color: var(--muted); font-size: 12px; line-height: 1.5; }

    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 14px; }
      .track-list { max-height: 220px; }
      .map-shell { height: 66vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>关联融合轨迹</h1>
      <p class="subtitle">读取 data_611 关联结果，真实点和预测补全点按时间顺序实时出现并连成轨迹。</p>

      <div class="toolbar">
        <button class="primary" id="loadDefault">加载默认结果</button>
        <label class="file-label" for="fileInput">选择其他 CSV</label>
        <input id="fileInput" type="file" accept=".csv,text/csv">
      </div>

      <div class="playback">
        <div class="button-row">
          <button class="primary" id="playPause">播放</button>
          <button class="danger" id="reset">重置</button>
        </div>
        <div class="control">
          <label for="progress"><span>时间进度</span><span id="progressText">0 / 0</span></label>
          <input id="progress" type="range" min="0" max="0" value="0" step="1">
        </div>
        <div class="control">
          <label for="speed"><span>播放速度</span><span id="speedText">1x</span></label>
          <input id="speed" type="range" min="0.25" max="8" value="1" step="0.25">
        </div>
      </div>

      <div class="stats">
        <div class="stat"><strong id="trackTotal">0</strong><span>轨迹数</span></div>
        <div class="stat"><strong id="visiblePointTotal">0</strong><span>当前点数</span></div>
      </div>

      <div class="time-card">
        <strong id="currentTime">未加载</strong>
        <span id="currentDetail">等待 CSV 数据。</span>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="dot"></span>真实点</span>
        <span class="legend-item"><span class="dot predicted"></span>预测补点</span>
      </div>

      <div class="track-list" id="trackList"></div>
    </aside>

    <main>
      <div class="map-shell" id="mapShell">
        <div class="tile-map" id="tileMap"></div>
        <canvas id="mapCanvas"></canvas>
        <div class="map-info" id="mapInfo">底图使用在线瓦片。若仍看不到地图，请检查浏览器是否能访问高德地图瓦片服务。</div>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_CSV = "data/output/data_611_associated.csv";
    const TILE_SIZE = 256;
    const palette = ["#0e7c68", "#c2472f", "#2f5aa8", "#9a6b12", "#7a3f99", "#008a9a", "#8b2f3a", "#557a1f", "#38424a", "#d06f1d"];
    const LABEL_REAL = "\u771f\u5b9e\u70b9";
    const LABEL_PREDICTED = "\u9884\u6d4b\u8865\u70b9";
    const LABEL_TRACK_ID = "\u8f68\u8ff9ID";
    const LABEL_COORD = "\u5750\u6807";
    const LABEL_HEIGHT = "\u9ad8\u5ea6";
    const LABEL_LINE = "\u8f68\u8ff9\u7ebf";
    const LABEL_SELECTED = "\u9009\u4e2d";
    const state = { tracks: [], timeline: [], currentIndex: 0, activeTrackId: null, isPlaying: false, lastFrameAt: 0, frameCarry: 0, speed: 1 };
    const mapState = { centerLng: 106.005, centerLat: 29.356, zoom: 16, topLeft: { x: 0, y: 0 }, isDragging: false, dragStart: null, dragStartTopLeft: null, dragMoved: false };

    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d");
    const tileMap = document.getElementById("tileMap");
    const trackList = document.getElementById("trackList");
    const trackTotal = document.getElementById("trackTotal");
    const visiblePointTotal = document.getElementById("visiblePointTotal");
    const currentTime = document.getElementById("currentTime");
    const currentDetail = document.getElementById("currentDetail");
    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progressText");
    const speed = document.getElementById("speed");
    const speedText = document.getElementById("speedText");
    const playPause = document.getElementById("playPause");
    const reset = document.getElementById("reset");
    const mapInfo = document.getElementById("mapInfo");

    document.getElementById("loadDefault").addEventListener("click", loadDefaultCsv);
    document.getElementById("fileInput").addEventListener("change", loadSelectedFile);
    playPause.addEventListener("click", togglePlayback);
    reset.addEventListener("click", resetPlayback);
    progress.addEventListener("input", () => { state.currentIndex = Number(progress.value); state.frameCarry = 0; updateUi(); draw(); });
    speed.addEventListener("input", () => { state.speed = Number(speed.value); speedText.textContent = `${state.speed}x`; });
    tileMap.addEventListener("wheel", handleWheelZoom, { passive: false });
    tileMap.addEventListener("pointerdown", handlePointerDown);
    window.addEventListener("pointermove", handlePointerMove);
    window.addEventListener("pointerup", handlePointerUp);
    window.addEventListener("pointercancel", handlePointerUp);
    window.addEventListener("resize", () => { renderTiles(); draw(); });

    async function loadDefaultCsv() {
      try {
        const response = await fetch(DEFAULT_CSV);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        loadCsvText(await response.text(), DEFAULT_CSV);
      } catch (error) {
        mapInfo.textContent = `默认文件读取失败：${error.message}。请确认服务启动目录是 association，或手动选择 CSV。`;
      }
    }

    function loadSelectedFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => loadCsvText(String(reader.result || ""), file.name);
      reader.onerror = () => { mapInfo.textContent = "文件读取失败。"; };
      reader.readAsText(file, "utf-8");
    }

    function loadCsvText(text, label) {
      stopPlayback();
      const rows = parseCsv(text);
      const tracksById = new Map();

      rows.forEach((row) => {
        const trackId = Number(row.tra_id);
        const x = Number(row.x);
        const y = Number(row.y);
        const z = Number(row.z);
        const timeMs = Date.parse(row.ts);
        if (!Number.isFinite(trackId) || !Number.isFinite(x) || !Number.isFinite(y)) return;
        if (!tracksById.has(trackId)) tracksById.set(trackId, []);
        tracksById.get(trackId).push({ ts: row.ts, timeMs: Number.isFinite(timeMs) ? timeMs : tracksById.get(trackId).length, id: row.id, trackId, x, y, z: Number.isFinite(z) ? z : 0, isPredicted: row.is_predicted === "1" || row.point_type === "predicted" });
      });

      state.tracks = Array.from(tracksById.entries())
        .map(([id, points], index) => ({
          id,
          color: palette[index % palette.length],
          points: preferRealAtSameTime(points).sort((a, b) => a.timeMs - b.timeMs)
        }))
        .sort((a, b) => a.id - b.id);
      state.timeline = buildTimeline(state.tracks);
      state.currentIndex = state.timeline.length ? 0 : 0;
      state.activeTrackId = state.tracks[0] ? state.tracks[0].id : null;
      progress.max = String(Math.max(0, state.timeline.length - 1));
      progress.value = String(state.currentIndex);
      fitMapToTracks();
      updateUi();
      renderTiles();
      draw();
      mapInfo.textContent = `已加载 ${label}。空心点为预测补全点，实心点为原始真实点。`;
    }

    function buildTimeline(tracks) {
      return tracks.flatMap((track) => track.points.map((point) => ({ trackId: track.id, point }))).sort((a, b) => a.point.timeMs - b.point.timeMs || a.trackId - b.trackId);
    }

    function preferRealAtSameTime(points) {
      const groups = new Map();
      points.forEach((point) => {
        const key = Number.isFinite(point.timeMs) ? String(Math.floor(point.timeMs / 1000)) : point.ts;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(point);
      });

      return Array.from(groups.values()).flatMap((group) => {
        const realPoints = group.filter((point) => !point.isPredicted);
        return realPoints.length ? realPoints : group;
      });
    }

    function parseCsv(text) {
      const clean = text.replace(/^\uFEFF/, "").trim();
      if (!clean) return [];
      const lines = clean.split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = splitCsvLine(lines[0]).map((h) => h.trim());
      return lines.slice(1).map((line) => {
        const values = splitCsvLine(line);
        const row = {};
        headers.forEach((header, index) => { row[header] = values[index] === undefined ? "" : values[index].trim(); });
        return row;
      });
    }

    function splitCsvLine(line) {
      const values = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        const next = line[i + 1];
        if (char === '"' && inQuotes && next === '"') { current += '"'; i += 1; }
        else if (char === '"') inQuotes = !inQuotes;
        else if (char === "," && !inQuotes) { values.push(current); current = ""; }
        else current += char;
      }
      values.push(current);
      return values;
    }

    function fitMapToTracks() {
      const points = state.tracks.flatMap((track) => track.points);
      if (!points.length) return;
      const shell = tileMap.getBoundingClientRect();
      const minLng = Math.min(...points.map((p) => p.x));
      const maxLng = Math.max(...points.map((p) => p.x));
      const minLat = Math.min(...points.map((p) => p.y));
      const maxLat = Math.max(...points.map((p) => p.y));
      mapState.centerLng = (minLng + maxLng) / 2;
      mapState.centerLat = (minLat + maxLat) / 2;
      mapState.zoom = chooseZoom(minLng, minLat, maxLng, maxLat, shell.width, shell.height);
      updateTopLeft(shell);
    }

    function chooseZoom(minLng, minLat, maxLng, maxLat, width, height) {
      const pad = 96;
      for (let z = 18; z >= 3; z -= 1) {
        const a = lngLatToWorld(minLng, maxLat, z);
        const b = lngLatToWorld(maxLng, minLat, z);
        if (Math.abs(b.x - a.x) <= width - pad && Math.abs(b.y - a.y) <= height - pad) return z;
      }
      return 3;
    }

    function updateTopLeft(rect) {
      const center = lngLatToWorld(mapState.centerLng, mapState.centerLat, mapState.zoom);
      mapState.topLeft = { x: center.x - rect.width / 2, y: center.y - rect.height / 2 };
    }

    function lngLatToWorld(lng, lat, zoom) {
      const sinLat = Math.sin(lat * Math.PI / 180);
      const scale = TILE_SIZE * Math.pow(2, zoom);
      return { x: (lng + 180) / 360 * scale, y: (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale };
    }

    function worldToLngLat(x, y, zoom) {
      const scale = TILE_SIZE * Math.pow(2, zoom);
      const lng = x / scale * 360 - 180;
      const n = Math.PI - 2 * Math.PI * y / scale;
      const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
      return { lng, lat };
    }

    function handleWheelZoom(event) {
      event.preventDefault();
      const rect = tileMap.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const oldZoom = mapState.zoom;
      const nextZoom = Math.max(3, Math.min(19, oldZoom + (event.deltaY < 0 ? 1 : -1)));
      if (nextZoom === oldZoom) return;

      updateTopLeft(rect);
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;
      const oldWorldUnderMouse = {
        x: mapState.topLeft.x + mouseX,
        y: mapState.topLeft.y + mouseY
      };
      const lngLatUnderMouse = worldToLngLat(oldWorldUnderMouse.x, oldWorldUnderMouse.y, oldZoom);
      const newWorldUnderMouse = lngLatToWorld(lngLatUnderMouse.lng, lngLatUnderMouse.lat, nextZoom);

      mapState.zoom = nextZoom;
      mapState.topLeft = {
        x: newWorldUnderMouse.x - mouseX,
        y: newWorldUnderMouse.y - mouseY
      };
      const centerWorld = {
        x: mapState.topLeft.x + rect.width / 2,
        y: mapState.topLeft.y + rect.height / 2
      };
      const center = worldToLngLat(centerWorld.x, centerWorld.y, nextZoom);
      mapState.centerLng = center.lng;
      mapState.centerLat = center.lat;
      renderTiles();
      draw();
    }

    function handlePointerDown(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      const rect = tileMap.getBoundingClientRect();
      updateTopLeft(rect);
      mapState.isDragging = true;
      mapState.dragStart = { x: event.clientX, y: event.clientY };
      mapState.dragStartTopLeft = { ...mapState.topLeft };
      mapState.dragMoved = false;
      tileMap.classList.add("dragging");
    }

    function handlePointerMove(event) {
      if (!mapState.isDragging || !mapState.dragStart || !mapState.dragStartTopLeft) return;
      const rect = tileMap.getBoundingClientRect();
      const dx = event.clientX - mapState.dragStart.x;
      const dy = event.clientY - mapState.dragStart.y;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) mapState.dragMoved = true;
      mapState.topLeft = {
        x: mapState.dragStartTopLeft.x - dx,
        y: mapState.dragStartTopLeft.y - dy
      };
      const centerWorld = {
        x: mapState.topLeft.x + rect.width / 2,
        y: mapState.topLeft.y + rect.height / 2
      };
      const center = worldToLngLat(centerWorld.x, centerWorld.y, mapState.zoom);
      mapState.centerLng = center.lng;
      mapState.centerLat = center.lat;
      renderTiles(false);
      draw();
    }

    function handlePointerUp(event) {
      if (!mapState.isDragging) return;
      const wasClick = !mapState.dragMoved;
      mapState.isDragging = false;
      mapState.dragStart = null;
      mapState.dragStartTopLeft = null;
      mapState.dragMoved = false;
      tileMap.classList.remove("dragging");
      renderTiles();
      draw();
      if (wasClick) handleMapClick(event);
    }

    function handleMapClick(event) {
      const hit = findNearestTrackHit(event.clientX, event.clientY);
      if (!hit) return;
      state.activeTrackId = hit.track.id;
      renderTrackList();
      draw();

      if (hit.point) {
        currentTime.textContent = hit.point.ts;
        const pointType = hit.point.isPredicted ? LABEL_PREDICTED : LABEL_REAL;
        currentDetail.textContent = `${pointType}, ${LABEL_TRACK_ID} ${hit.track.id}, ${LABEL_COORD} ${hit.point.x.toFixed(6)}, ${hit.point.y.toFixed(6)}, ${LABEL_HEIGHT} ${hit.point.z.toFixed(2)}`;
        mapInfo.textContent = `${LABEL_SELECTED}${LABEL_TRACK_ID} ${hit.track.id}, ${pointType}`;
      } else {
        currentDetail.textContent = `${LABEL_SELECTED}${LABEL_TRACK_ID} ${hit.track.id} ${LABEL_LINE}`;
        mapInfo.textContent = `${LABEL_SELECTED}${LABEL_TRACK_ID} ${hit.track.id}`;
      }
    }

    function findNearestTrackHit(clientX, clientY) {
      const rect = tileMap.getBoundingClientRect();
      const mouse = { x: clientX - rect.left, y: clientY - rect.top };
      let bestPoint = null;
      let bestSegment = null;

      state.tracks.forEach((track) => {
        const points = visiblePointsForTrack(track);
        points.forEach((point) => {
          const p = projectPoint(point);
          const d = Math.hypot(mouse.x - p.x, mouse.y - p.y);
          if (d <= 12 && (!bestPoint || d < bestPoint.distance)) {
            bestPoint = { type: "point", track, point, distance: d };
          }
        });
        for (let i = 1; i < points.length; i += 1) {
          const a = projectPoint(points[i - 1]);
          const b = projectPoint(points[i]);
          const d = pointToSegmentDistance(mouse, a, b);
          if (d <= 8 && (!bestSegment || d < bestSegment.distance)) {
            bestSegment = { type: "segment", track, point: null, distance: d };
          }
        }
      });

      return bestPoint || bestSegment;
    }

    function pointToSegmentDistance(p, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
      const x = a.x + t * dx;
      const y = a.y + t * dy;
      return Math.hypot(p.x - x, p.y - y);
    }

    function projectPoint(point) {
      const world = lngLatToWorld(point.x, point.y, mapState.zoom);
      return { x: world.x - mapState.topLeft.x, y: world.y - mapState.topLeft.y };
    }

    function tileUrl(x, y, z) {
      const sub = Math.abs(x + y) % 4 + 1;
      return `https://webrd0${sub}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x=${x}&y=${y}&z=${z}`;
    }

    function renderTiles(recalculateTopLeft = true) {
      const rect = tileMap.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      if (recalculateTopLeft) updateTopLeft(rect);
      tileMap.innerHTML = "";
      const z = mapState.zoom;
      const tileCount = Math.pow(2, z);
      const startX = Math.floor(mapState.topLeft.x / TILE_SIZE);
      const endX = Math.floor((mapState.topLeft.x + rect.width) / TILE_SIZE);
      const startY = Math.floor(mapState.topLeft.y / TILE_SIZE);
      const endY = Math.floor((mapState.topLeft.y + rect.height) / TILE_SIZE);
      for (let ty = startY; ty <= endY; ty += 1) {
        if (ty < 0 || ty >= tileCount) continue;
        for (let tx = startX; tx <= endX; tx += 1) {
          const wrappedX = ((tx % tileCount) + tileCount) % tileCount;
          const img = document.createElement("img");
          img.src = tileUrl(wrappedX, ty, z);
          img.alt = "";
          img.style.left = `${tx * TILE_SIZE - mapState.topLeft.x}px`;
          img.style.top = `${ty * TILE_SIZE - mapState.topLeft.y}px`;
          img.onerror = () => { img.style.display = "none"; };
          tileMap.appendChild(img);
        }
      }
    }

    function togglePlayback() { if (!state.timeline.length) return; state.isPlaying ? stopPlayback() : startPlayback(); }
    function startPlayback() { if (state.currentIndex >= state.timeline.length - 1) state.currentIndex = 0; state.isPlaying = true; state.lastFrameAt = performance.now(); playPause.textContent = "暂停"; requestAnimationFrame(playLoop); }
    function stopPlayback() { state.isPlaying = false; playPause.textContent = "播放"; }
    function resetPlayback() { stopPlayback(); state.currentIndex = 0; state.frameCarry = 0; updateUi(); draw(); }

    function playLoop(now) {
      if (!state.isPlaying) return;
      const elapsed = now - state.lastFrameAt;
      state.lastFrameAt = now;
      state.frameCarry += elapsed / 1000 * 18 * state.speed;
      const step = Math.max(0, Math.floor(state.frameCarry));
      if (step > 0) { state.frameCarry -= step; state.currentIndex = Math.min(state.timeline.length - 1, state.currentIndex + step); updateUi(); draw(); }
      if (state.currentIndex >= state.timeline.length - 1) { stopPlayback(); return; }
      requestAnimationFrame(playLoop);
    }

    function updateUi() {
      trackTotal.textContent = String(state.tracks.length);
      visiblePointTotal.textContent = String(visiblePoints().length);
      progress.value = String(state.currentIndex);
      progressText.textContent = `${state.timeline.length ? state.currentIndex + 1 : 0} / ${state.timeline.length}`;
      const current = state.timeline[state.currentIndex];
      if (current) {
        currentTime.textContent = current.point.ts;
        currentDetail.textContent = `${current.point.isPredicted ? "预测补点" : "真实点"}，轨迹 ${current.trackId}，坐标 ${current.point.x.toFixed(6)}, ${current.point.y.toFixed(6)}，高度 ${current.point.z.toFixed(2)}`;
      } else {
        currentTime.textContent = "未加载";
        currentDetail.textContent = "等待 CSV 数据。";
      }
      renderTrackList();
    }

    function renderTrackList() {
      trackList.innerHTML = "";
      state.tracks.forEach((track) => {
        const item = document.createElement("button");
        item.className = `track-item${track.id === state.activeTrackId ? " active" : ""}`;
        item.type = "button";
        item.addEventListener("click", () => { state.activeTrackId = track.id; renderTrackList(); draw(); });
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = track.color;
        const name = document.createElement("span");
        name.className = "track-name";
        name.textContent = `轨迹 ${track.id}`;
        const count = document.createElement("span");
        count.className = "track-count";
        count.textContent = `${visiblePointsForTrack(track).length}/${track.points.length}`;
        item.append(swatch, name, count);
        trackList.appendChild(item);
      });
    }

    function visiblePoints() {
      const visibleSet = new Set(state.timeline.slice(0, state.currentIndex + 1).map((entry) => entry.point));
      return state.tracks.flatMap((track) => track.points.filter((point) => visibleSet.has(point)));
    }

    function visiblePointsForTrack(track) {
      const visibleSet = new Set(state.timeline.slice(0, state.currentIndex + 1).map((entry) => entry.point));
      return track.points.filter((point) => visibleSet.has(point));
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!state.tracks.length) { drawEmpty(rect); return; }
      state.tracks.forEach((track) => drawTrack(track, projectPoint, track.id === state.activeTrackId));
    }

    function drawEmpty(rect) {
      ctx.save();
      ctx.fillStyle = "#6b756f";
      ctx.font = "15px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("暂无轨迹数据", rect.width / 2, rect.height / 2);
      ctx.restore();
    }

    function drawTrack(track, project, active) {
      const points = visiblePointsForTrack(track);
      if (!points.length) return;
      ctx.save();
      ctx.globalAlpha = active ? 1 : 0.34;
      ctx.lineWidth = active ? 3.4 : 1.7;
      ctx.strokeStyle = track.color;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (points.length > 1) {
        ctx.beginPath();
        points.forEach((point, index) => { const p = project(point); index === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
        ctx.stroke();
      }
      const drawPoint = (point, index) => {
        const p = project(point);
        const isLatest = index === points.length - 1;
        ctx.beginPath();
        ctx.lineWidth = point.isPredicted ? 2.2 : 1;
        ctx.strokeStyle = track.color;
        ctx.fillStyle = point.isPredicted ? "#ffffff" : (isLatest ? "#17201b" : track.color);
        ctx.arc(p.x, p.y, active ? (isLatest ? 6 : 4) : 3, 0, Math.PI * 2);
        ctx.fill();
        if (point.isPredicted) ctx.stroke();
        if (active && isLatest) {
          ctx.beginPath();
          ctx.strokeStyle = track.color;
          ctx.globalAlpha = 0.24;
          ctx.lineWidth = 8;
          ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      };

      // Draw predicted points first so overlapping real detections remain visible as solid points.
      points.forEach((point, index) => { if (point.isPredicted) drawPoint(point, index); });
      points.forEach((point, index) => { if (!point.isPredicted) drawPoint(point, index); });
      ctx.restore();
    }

    renderTiles();
    loadDefaultCsv();
  </script>
</body>
</html>
